---
# ============================================================================
# Ansible-TEST-FS : 検証機（ファイルサーバ相当）
#   設計書 シート「8.ファイルサーバ」の設定を適用する。
#   ※設計書のコンピュータ名欄（シート8 3. ｺﾝﾋﾟｭｰﾀ名）はサンプル版でマスク。
#   ※今回の初期構築ではドメイン参加は行わない
#     （inventory/group_vars/all/main.yml の enable_domain_join: false）
# ============================================================================
computer_name:   "Ansible-TEST-FS"
os_version:      "Windows Server 2025 Datacenter"
server_purpose:  "検証機(ファイルサーバ相当 / FSRM・FTP)"

# ---- 1.8 時刻同期設定 -------------------------------------------------------
# 本来はドメイン参加サーバとしてドメインコントローラから自動同期する（NT5DS）。
# 今回はドメイン未参加で時刻同期先が無くなるため、検証機に限り外部 NTP と
# 手動同期させる（docs/03_要確認事項.md A-4）。
is_pdc_emulator: true
ntp_servers:     "ntp.nict.jp,0x8"
