---
# ============================================================================
# 検証用インベントリ（今回の Ansible 初期構築の対象）
#   対象は 1 台（Ansible-TEST-FS）のみ。
#   設計書「sample_Windows詳細設計書」シート「8.ファイルサーバ」＝ 概要 No.7 の
#   設定を適用する。
#
#   本番相当の 7 台構成は inventory/hosts.yml を参照
#   （実行時に -i inventory/hosts.yml を指定する）。
#
#   今回のスコープ外:
#     ・ドメイン参加（enable_domain_join: false）
#     ・タスクスケジューラ「SHM商品マスター更新」（概要 1.13 No.1）
#   詳細は docs/01_構築手順.md「0. 今回のスコープ」を参照。
# ============================================================================
all:
  children:

    windows:
      children:

        # --- ファイルサーバ相当の検証機（設計書 No.7 の設定を適用する） -----
        fileserver:
          hosts:
            Ansible-TEST-FS:
              ansible_host: 10.0.1.17      # 仮値。実機の IP に置き換えること
