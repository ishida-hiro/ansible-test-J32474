[defaults]
# 既定のインベントリは置かない。案件ごとに inventories/<案件>/ があるため、
# 実行時に -i で対象案件を必ず指定する（別案件のサーバへ誤って流さないため）。
#   例: ansible-playbook playbooks/site.yml -i inventories/pickles/test.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# yaml コールバックは ansible-core から削除されたため、
# 後継の default + result_format=yaml を使う
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 10
log_path             = ./logs/ansible.log
# 実行ログ（証跡）は logs/ 配下に出力される
timeout              = 60

[persistent_connection]
command_timeout = 120
connect_timeout = 120
