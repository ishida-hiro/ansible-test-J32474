---
# ============================================================================
# win_remote : リモート接続設定
#   設計書 1.7 リモートデスクトップを使用して接続する
#   詳細シート 3.ｻｰﾊﾞｰﾏﾈｰｼﾞｬｰ
#     ﾘﾓｰﾄﾃﾞｽｸﾄｯﾌﾟ = 「このｺﾝﾋﾟｭｰﾀへのﾘﾓｰﾄ接続を許可する」
#                    ＋「ﾈｯﾄﾜｰｸﾚﾍﾞﾙ認証でのみ接続を許可する」
#     ﾘﾓｰﾄ管理     = 有効（既定）
# ============================================================================

- name: リモートデスクトップ接続を許可する（fDenyTSConnections = 0）
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
    name: fDenyTSConnections
    data: "{{ 0 if enable_rdp | bool else 1 }}"
    type: dword

- name: ネットワークレベル認証(NLA)を要求する
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    name: UserAuthentication
    data: "{{ 1 if rdp_require_nla | bool else 0 }}"
    type: dword
  when: enable_rdp | bool

- name: RDP のセキュリティレイヤーを SSL(TLS) にする
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    name: SecurityLayer
    data: 2                       # 2 = SSL(TLS 1.0)
    type: dword
  when: enable_rdp | bool

- name: リモートデスクトップのファイアウォール規則を有効にする
  community.windows.win_firewall_rule:
    group: "リモート デスクトップ"
    enabled: true
    state: present
    name: "Remote Desktop - User Mode (TCP-In)"
    localport: 3389
    action: allow
    direction: in
    protocol: tcp
  when: enable_rdp | bool
  failed_when: false              # ファイアウォール無効時は規則更新に失敗しても継続する

- name: サーバーのリモート管理(WinRM)を有効にする
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $svc = Get-Service -Name WinRM
      if ($svc.StartType -ne 'Automatic') {
          Set-Service -Name WinRM -StartupType Automatic
          $Ansible.Changed = $true
      }
      if ($svc.Status -ne 'Running') {
          Start-Service -Name WinRM
          $Ansible.Changed = $true
      }
  when: enable_remote_management | bool

- name: リモート接続設定を確認する
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      [pscustomobject]@{
        fDenyTSConnections = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server').fDenyTSConnections
        UserAuthentication = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp').UserAuthentication
        WinRM              = (Get-Service WinRM).Status.ToString()
      }
  register: r_remote
  changed_when: false

- name: リモート接続設定を表示する
  ansible.builtin.debug:
    var: r_remote.output
