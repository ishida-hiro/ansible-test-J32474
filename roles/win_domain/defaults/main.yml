---
# 設計書 1.2「ドメイン参加」
# enable_domain_join / ad_domain_name は win_verify でも使うため win_standard で定義している
# 共通の設定値は roles/win_standard/defaults/main.yml を参照（meta の依存で読み込む）

# 案件ごとに指定する（enable_domain_join: true の場合は必須）
ad_netbios_name: ""
ad_domain_ou_path: ""

# DC 昇格モード（dc グループのみ）
#   new_forest    : 新規フォレストを作成する
#   additional_dc : 既存ドメインへ追加ドメインコントローラとして昇格する
ad_mode: additional_dc

# DC 昇格時のデータベース／ログ／SYSVOL 配置
ad_database_path: 'C:\Windows\NTDS'
ad_log_path:      'C:\Windows\NTDS'
ad_sysvol_path:   'C:\Windows\SYSVOL'

# ドメイン参加前に設定する DNS サーバ（空なら Azure(DHCP) 配布値のまま）
domain_dns_servers: []
