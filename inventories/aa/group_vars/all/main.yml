---
# ============================================================================
# AA様（Azureクラウドリフト）全ホスト共通パラメータ（設計書「1.概要」より）
#   設計書: AA様【Azureリフト】WindowsServer設計書_検証用.xlsx
#
#   JBCC 標準値（roles/win_standard・各ロールの defaults）との差分だけを書く。
#   標準と同じ値はここに書かない（どこが案件固有かを見えるようにするため）。
#
#   標準値のままで設計書と一致している項目:
#     1.6 日本語・Tokyo Standard Time / 1.7 RDP 許可・NLA
#     1.10 ファイアウォール無効（NSG で制御）/ 1.12 UAC 無効
#     1.14 構築時に更新適用・自動更新の構成 = 無効（最新化の後に無効化する順序も一致）
#     詳細シート 3. IE ESC オフ・診断データ オフ / 4. イベントログ 20480KB
#     詳細シート 11. hosts = 記載なし
# ============================================================================

# ---- 1.2 ドメイン参加 -------------------------------------------------------
# 検証環境には AD が無いため参加しない（標準値 enable_domain_join: false のまま）。
ad_domain_name: "jbcc.local"
# NetBIOS 名は設計書に記載が無い。ドメイン参加を実施する場合は確認して設定する
# （enable_domain_join: true で未設定なら win_domain が冒頭で止まる）。
ad_netbios_name: ""
# 詳細シート 10. DNS 詳細設定「※ドメイン参加時は 192.168.0.205 / 192.168.1.202 とする」。
# DC 昇格後は 192.168.100.11 / 192.168.100.12 に切り替える（構築の範囲外）。
domain_dns_servers:
  - "192.168.0.205"
  - "192.168.1.202"

# ---- 1.11 Windows Defender --------------------------------------------------
# 設計書: セキュリティソフト（Cortex）導入後に GPO で無効化する（Cortex の導入はお客様作業）。
# 詳細シート 3. でもリアルタイム保護 = 有効（※Cortex 導入後に無効）。
# 構築時点では無効化しないため、標準値（true）を上書きする。
disable_defender_by_policy: false

# ---- 1.5 ネットワーク設定（IPv6 無効化） -----------------------------------
# 詳細シート 10. は DisabledComponents = 0xFFFFFFFF を指定しているが、
# 標準（win_network）は 0xFF を設定する。0xFFFFFFFF は Microsoft が推奨しておらず
# 起動が遅くなる既知の事象があるため、標準値のままにしてお客様に確認する
# （検証記録「課題」に記載）。

# ---- 5. システムのプロパティ（仮想メモリ） ----------------------------------
# P様（docs/03_要確認事項.md B-1）と同じ記載の矛盾がある
# （自動管理オフ・C/D ともページングファイルなし・総容量 1280MB）。
# 標準値 pagefile_configure: false のまま（変更しない）。

# ---- 1.15 ホスト名の戻し ----------------------------------------------------
# 構築・移行完了後の作業のため構築の範囲外（TOKYO-SWS-AZ → TOKYO-SWS）。
