---
# ============================================================================
# NEW-HOST-01 : <用途>（設計書 シート「<シート名>」）
#   ホスト固有の値だけを書く。ディレクトリ名はインベントリのホスト名と一致させる。
#   接続先 IP は同ディレクトリの connection.yml（git 管理外）に書く。
# ============================================================================
computer_name:  "NEW-HOST-01"
# 99_verify.yml の突合せで比較する OS 名。実機の Caption と同じ表記にする
# （Azure Marketplace イメージは "... Azure Edition" になる点に注意）
os_version:     "Windows Server 2025 Datacenter"
server_purpose: "<用途>"

