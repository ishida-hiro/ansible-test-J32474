# ============================================================================
# <案件名> インベントリ
#   設計書「1.概要」のサーバ一覧に対応させる。
#
#   グループ名はプレイブックが参照しているため変えないこと:
#     windows    : 全 Windows ホストの親グループ（必須）
#     dc         : ドメインコントローラ（02_domain.yml で昇格。1 台ずつ実行）
#     member     : ドメイン参加メンバーサーバ
#     fileserver : ファイルサーバ（03_role_setup.yml で FTP / タスクを構成）
#   使わないグループは消してよい。用途別の値は group_vars/<グループ名>.yml に書く。
#
#   接続先 IP はここに書かない。host_vars/<ホスト名>/connection.yml（git 管理外）に置く。
# ============================================================================
all:
  children:

    windows:
      children:

        member:
          hosts:
            NEW-HOST-01:        # 設計書 概要 No.x <用途>
