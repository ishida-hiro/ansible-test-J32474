---
# ============================================================================
# インベントリ
#   設計書「1.概要」の No.1〜7 に対応。
#   ※設計書のホスト名欄は #REF!/空欄だったため、本文の記述
#     （S-AZR-001(AD1) / 002(AD2) / 003(TimePro VG) / 004(RDS) /
#       005(SQL) / 006(DocWaysFAX) / 007(ファイル)）から採番している。
#   ansible_host は「Azure構成パラメータシート」の IP に置き換えること。
# ============================================================================
all:
  children:

    windows:
      children:

        # --- No.1,2 : ADサーバ（AD DS + DNS / Windows Server 2025） -------
        dc:
          hosts:
            S-AZR-001:
              ansible_host: 10.0.1.11
            S-AZR-002:
              ansible_host: 10.0.1.12

        # --- No.3〜6 : ドメイン参加メンバーサーバ ------------------------
        member:
          hosts:
            S-AZR-003:          # TimePro VG      (Windows Server 2025)
              ansible_host: 10.0.1.13
            S-AZR-004:          # 製品試算(RDS)   (Windows Server 2022)
              ansible_host: 10.0.1.14
            S-AZR-005:          # 製品電算(SQL)   (Windows Server 2022)
              ansible_host: 10.0.1.15
            S-AZR-006:          # DocWays FAX     (Windows Server 2022)
              ansible_host: 10.0.1.16

        # --- No.7 : ファイルサーバ（FSRM + FTP / Windows Server 2025） ---
        fileserver:
          hosts:
            S-AZR-007:
              ansible_host: 10.0.1.17
