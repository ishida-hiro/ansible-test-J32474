---
# ============================================================================
# Windows 共通：接続設定
#   既定は WinRM over HTTPS(5986) / NTLM。
#   ドメイン参加後にドメイン管理者で接続する場合は kerberos も可。
# ============================================================================
ansible_connection: winrm
ansible_port: 5986
ansible_winrm_scheme: https
ansible_winrm_transport: ntlm
ansible_winrm_server_cert_validation: ignore   # 自己署名証明書のため検証しない
ansible_winrm_read_timeout_sec: 180
ansible_winrm_operation_timeout_sec: 120
ansible_winrm_message_encryption: always

# 接続ユーザ（構築中はローカル管理者を使用）
ansible_user: "{{ vault_local_admin_user }}"
ansible_password: "{{ vault_local_admin_password }}"
