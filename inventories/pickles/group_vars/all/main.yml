---
# ============================================================================
# P様 全ホスト共通パラメータ（設計書「1.概要」より）
#
#   JBCC 標準値（roles/win_standard・各ロールの defaults）との差分だけを書く。
#   標準と同じ値はここに書かない。書くと「どこが案件固有か」が見えなくなるため。
#
#   標準値のままで設計書と一致している項目:
#     1.5 IPv6 無効 / 1.6 日本語・Tokyo Standard Time / 1.7 RDP 許可・NLA
#     1.10 ファイアウォール無効（NSG で制御）/ 1.11 Defender をポリシーで無効化
#     1.12 UAC 無効 / 1.14 構築時に更新適用・自動更新の構成 = 無効
#     詳細シート 3. IE ESC オフ・診断データ オフ / 4. イベントログ 20480KB
# ============================================================================

# ---- 1.2 ドメイン参加 -------------------------------------------------------
# 今回の Ansible 初期構築ではドメイン参加 / DC 昇格を実施しない（標準値 false のまま）。
# 実施する場合は enable_domain_join: true を追加する（docs/01_構築手順.md「0. 今回のスコープ」参照）。
ad_domain_name:    "PICKLES-CORP.pickles.co.jp"
ad_netbios_name:   "PICKLES-CORP"

# ---- 1.13 タスクスケジューラ ------------------------------------------------
# 今回は対象外。実行ユーザ Administrator が Azure の Windows VM には存在せず
# （組み込み管理者は無効化・改名される）、win_scheduled_task が
# SID 変換に失敗するため。詳細は docs/03_要確認事項.md B-4 参照。
enable_scheduled_tasks: false

# ---- 1.15 サービス設定 ------------------------------------------------------
windows_services_config:
  - name: vmictimesync             # Hyper-V Time Synchronization Service
    start_mode: disabled
    state: stopped
    note: "時刻同期先を Hyper-V ホストにしないため無効化"

# ---- 5. システムのプロパティ（仮想メモリ） ----------------------------------
# 設計書の記載に矛盾があるため未設定（標準値 pagefile_configure: false のまま）。
# docs/03_要確認事項.md B-1 参照。
